# Pi upstream: @earendil-works/chord@1.6.0 dist/output.js — sanitizeOutput keeps numeric SGR colours, which 1.6.0 strips with the other escape sequences. Drop when Pi keeps SGR.
# Pi upstream: @earendil-works/pi-durable@1.6.0 dist/harness/inbox.js, dist/harness/harness.js — transactional beforeInput hook places entries before a new run’s first input; its api.agent(id) resolves agents within that transaction, and hooks of extensions an earlier hook enabled run too. Drop when Pi ships input-placement hooks.
# Pi upstream: @earendil-works/pi-durable@1.6.0 dist/harness/inbox.js, dist/types.d.ts — mark entries placed from input submissions. Drop when Pi ships input provenance.
# Pi upstream: @earendil-works/pi-durable@1.6.0 dist/harness/scheduler.js, dist/harness/harness.js — Harness.hold()/release() keep the scheduler from starting task runs. Drop when Pi Durable ships a scheduler hold.
# Pi upstream: @earendil-works/pi-durable@1.6.0 dist/env/node.js — NodeExecutionEnv takes a spawn option (lib/spawn.ts starts processes from a small helper). Drop when Pi Durable lets an environment choose how it starts processes.
# Pi upstream: @earendil-works/pi-durable@1.6.0 dist/harness/compaction.js: a compaction summary may use the model's output limit, as pi-coding-agent's has since pi #9512, instead of 0.8 × reserveTokens, which reasoning used up. Drop when Pi Durable sizes summaries the same way.
# patches/@earendil-works__chord@1.6.0.patch and patches/@earendil-works__pi-durable@1.6.0.patch: pnpm errors when a versioned patch no longer matches.
# Pi upstream: @earendil-works/pi-ai@1.6.0 dist/api/constrained-sampling.js — getGrammarToolInput replays a recorded grammar tool call without its string input as its JSON instead of throwing, which failed every later request of the conversation. Drop when upstream replays such calls.
# Pi upstream: @earendil-works/pi-coding-agent@1.6.0 dist/core/model-runtime.js — ModelRuntime.create() passes an authContext option to createModels, so provider keys in Ultimate's Secrets resolve like environment variables (lib/secrets.ts secretsAuthContext). Drop when upstream accepts an authContext.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 (d5b5e04c314d3452d357174d16d10dda34daa2d2) src/claude-cli.ts — rebuild replay cache markers within Claude's four-block limit; word a response that ends without Claude Code's own error so pi-ai retries it ("stream ended without"), with stderr as detail only (#562356); accept the bare-string first user message Claude Code sends when replaying a history that starts with "/"; src/stream.ts — resolve a tool named without its MCP prefix instead of ending the turn, and parse a streaming tool call's partial arguments; src/transcript.ts — define later tools inline (inline-tools beta) instead of falling back to one merged system prompt after a tool redefinition. Drop when upstream fixes this.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts — drain waits remove error listeners, and turn and discovery stdin absorb write errors without a pending drain. Drop when upstream fixes this.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts — useSpawn() sets how Claude Code's processes start (lib/spawn.ts). Drop when upstream accepts a spawn function.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts — childExit() settles for a child that already exited: model discovery reads stdout to its end first, and 'exit' can precede that, which hung discovery until the next refresh. Drop when upstream fixes this.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/provider.ts, src/claude-cli.ts — an auth check whose claude auth status gave no answer (upstream's `diagnostic`, also for JSON without a boolean loggedIn) keeps the last confirmed login for that environment instead of hiding every Claude Code model; an unparsable status reports stderr only, since stdout holds the account's email. Drop when upstream does both.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts — model discovery deletes an inherited CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC and DISABLE_TELEMETRY (#542940), and turns keep an explicit CLAUDE_CODE_DISABLE_AUTO_MEMORY=0 (Ultimate's opt-in). Drop when upstream respects both.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/transcript.ts — prepareMessages gives an invalid tool id a hash suffix, so two ids that normalise alike stay distinct. Drop when upstream does.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/model-catalog.ts — a discovered model missing from Pi's built-in list takes the context window and max output of its family's newest built-in model instead of 200k / 64k: Claude Code's discovery reports no limits, and Fable 5.2 has 1M / 128k (its modelUsage, #544597). Drop when upstream reads real limits or lists the model.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts, src/turn-relay.ts — useExchangeTap() keeps each turn's relayed request and raw response (credentials redacted) and hands it to Ultimate's Wire after the turn. Drop when upstream exposes the relay's exchanges.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/turn-relay.ts — retry a request up to 3 times (250 ms, 1 s, 2 s) when its connection fails in transport (TLS alert, ECONNRESET, EPIPE, socket hang up, ETIMEDOUT) before any response byte reached Claude Code; never an HTTP status or a cancelled turn (anthropics/claude-code#106197). Drop when upstream fixes this.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts — killProcessTree() signals a process group only for an integer pid above 1 and otherwise ends the child alone: kill(-1) is every process of the user, and a test child with pid 1 ended a desktop session that way (#562356). Drop when upstream checks the pid before a group kill.
# Dependabot GHSA-587h-7wmj-h5pm and siblings: @tailwindcss/vite resolves vite 8.3.1 on its own. Drop when it peers on >= 8.3.3.
overrides:
  vite: 8.3.5
patchedDependencies:
  '@earendil-works/chord@1.6.0': patches/@earendil-works__chord@1.6.0.patch
  '@earendil-works/pi-ai@1.6.0': patches/@earendil-works__pi-ai@1.6.0.patch
  '@earendil-works/pi-claude-code@0.1.0': patches/@earendil-works__pi-claude-code@0.1.0.patch
  '@earendil-works/pi-coding-agent@1.6.0': patches/@earendil-works__pi-coding-agent@1.6.0.patch
  '@earendil-works/pi-durable@1.6.0': patches/@earendil-works__pi-durable@1.6.0.patch
