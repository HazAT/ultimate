allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
  workerd: set this to true or false
minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.5.2'
  - '@earendil-works/pi-agent-core@1.5.2'
  - '@earendil-works/pi-ai@1.5.2'
  - '@earendil-works/pi-codemode@1.5.2'
  - '@earendil-works/pi-coding-agent@1.5.2'
  - '@earendil-works/pi-durable@1.5.2'
  - '@earendil-works/pi-mcp@1.5.2'
  - '@earendil-works/pi-telemetry@1.5.2'
  - '@earendil-works/pi-tui@1.5.2'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0'
  - vite-plus@1.4.0
  - '@earendil-works/pi-schema@1.5.2'
# Pi upstream: @earendil-works/chord@1.5.2 dist/output.js — sanitizeOutput keeps numeric SGR colours, which 1.5.2 strips with the other escape sequences. Drop when Pi keeps SGR.
# Pi upstream: @earendil-works/pi-durable@1.5.2 dist/harness/inbox.js — transactional beforeInput hook places entries before a new run’s first input. Drop when Pi ships input-placement hooks.
# Pi upstream: @earendil-works/pi-durable@1.5.2 dist/harness/inbox.js, dist/types.d.ts — mark entries placed from input submissions. Drop when Pi ships input provenance.
# Pi upstream: @earendil-works/pi-durable@1.5.2 dist/harness/scheduler.js, dist/harness/harness.js — Harness.hold()/release() keep the scheduler from starting task runs. Drop when Pi Durable ships a scheduler hold.
# Pi upstream: @earendil-works/pi-durable@1.5.2 dist/env/node.js — NodeExecutionEnv takes a spawn option (lib/spawn.ts starts processes from a small helper). Drop when Pi Durable lets an environment choose how it starts processes.
# Pi upstream: @earendil-works/pi-durable@1.5.2 dist/harness/compaction.js: a compaction summary may use the model's output limit, as pi-coding-agent's has since pi #9512, instead of 0.8 × reserveTokens, which reasoning used up. Drop when Pi Durable sizes summaries the same way.
# Pi upstream: @earendil-works/pi-durable@1.5.2 dist/harness/prompt.js — planSections appends a new or returning section instead of removing and re-adding every section to restore their order, which sent the whole system prompt again as cache writes (40 times in two days, #558178; `extensions/plan/test/plan.test.ts`). Drop when Pi Durable patches sections without re-adding the others.
# patches/@earendil-works__chord@1.5.2.patch and patches/@earendil-works__pi-durable@1.5.2.patch: pnpm errors when a versioned patch no longer matches.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts (70abb65186592ca788b29b3db22c3160d629c41f) — rebuild replay cache markers within Claude's four-block limit; word a response that ends without Claude Code's own error so pi-ai retries it, with stderr as detail only, and report an error Claude Code raises itself without a request ("Prompt is too long" from 2.1.319's context check in a warm process, #562356) as the reason; src/stream.ts — resolve a tool named without its MCP prefix instead of ending the turn; src/transcript.ts — define later tools inline (inline-tools beta) instead of falling back to one merged system prompt after a tool redefinition. Drop when upstream fixes this.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts — useSpawn() sets how Claude Code's processes start (lib/spawn.ts). Drop when upstream accepts a spawn function.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts — childExit() settles for a child that already exited: model discovery reads stdout to its end first, and 'exit' can precede that, which hung discovery until the next refresh. Drop when upstream fixes this.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts — model discovery runs without CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC and DISABLE_TELEMETRY: with either, Claude Code answers from its built-in model list, not the account's, so a newly released model (Fable 5.2 on 2.1.321, #542940) never appears. Drop when upstream discovers without them.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/model-catalog.ts — a discovered model missing from Pi's built-in list takes the context window and max output of its family's newest built-in model instead of 200k / 64k: Claude Code's discovery reports no limits, and Fable 5.2 has 1M / 128k (its modelUsage, #544597). Drop when upstream reads real limits or lists the model.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts, src/turn-relay.ts — useExchangeTap() keeps each turn's relayed request and raw response (credentials redacted) and hands it to Ultimate's Wire after the turn. Drop when upstream exposes the relay's exchanges.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/turn-relay.ts — retry a request up to 3 times (250 ms, 1 s, 2 s) when its connection fails in transport (TLS alert, ECONNRESET, EPIPE, socket hang up, ETIMEDOUT) before any response byte reached Claude Code; never an HTTP status or a cancelled turn (anthropics/claude-code#106197). Drop when upstream fixes this.
# Pi upstream: @earendil-works/pi-claude-code@0.1.0 src/claude-cli.ts — killProcessTree() signals a process group only for an integer pid above 1 and otherwise ends the child alone: kill(-1) is every process of the user, and a test child with pid 1 ended a desktop session that way (#562356). Drop when upstream checks the pid before a group kill.
# Dependabot GHSA-587h-7wmj-h5pm and siblings: @tailwindcss/vite and @vitejs/plugin-react resolve vite 8.3.1 on their own. Drop when they peer on >= 8.3.3.
overrides:
  vite: 8.3.5
patchedDependencies:
  '@earendil-works/chord@1.5.2': patches/@earendil-works__chord@1.5.2.patch
  '@earendil-works/pi-claude-code@0.1.0': patches/@earendil-works__pi-claude-code@0.1.0.patch
  '@earendil-works/pi-durable@1.5.2': patches/@earendil-works__pi-durable@1.5.2.patch
