<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- Home screen: standalone; App.tsx pads the safe area. No black-translucent status bar: under it iOS sizes the
         viewport a status bar short at launch and full later, so the bottom line floated or the page scrolled. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ultimate" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#111112" />
    <title>Ultimate</title>
    <style>
      html {
        background: oklch(0.985 0.002 270);
      }
      html.dark {
        background: oklch(0.178 0.003 270);
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Before the app loads: the stored preference, or the device's own appearance until someone chooses.
      {
        const stored = localStorage.getItem('ultimate.theme')
        const light =
          stored === 'light' ||
          (stored !== 'dark' && !matchMedia('(prefers-color-scheme: dark)').matches)
        if (light) {
          document.documentElement.classList.remove('dark')
          document.querySelector('meta[name=theme-color]').content = '#f9fafb'
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // A reload paints the page as it last looked until the app has rendered again (web/src/sdk/resume.ts).
      {
        const resume = JSON.parse(sessionStorage.getItem('ultimate.resume') ?? 'null')
        if (resume && Date.now() - resume.at < 30000) {
          const view = document.createElement('div')
          view.id = 'resume'
          view.inert = true
          view.style.cssText =
            'position:fixed;inset:0;z-index:2147483647;background:var(--background)'
          // The frame stays as the page that went away looked: sharp, until the app beneath shows the same again.
          const frame = document.createElement('div')
          frame.style.cssText = 'position:absolute;inset:0'
          frame.innerHTML = resume.html
          const style = document.createElement('style')
          // Offscreen content sizes itself only once rendered: lay it all out now, so the scroll offsets land.
          style.textContent = `${resume.css}
            #resume * { content-visibility: visible !important; }`
          view.append(style, frame)
          document.body.append(view)
          for (const element of view.querySelectorAll('[data-resume-scroll]')) {
            const [top, left] = element.dataset.resumeScroll.split(',')
            element.scrollTop = top
            element.scrollLeft = left
          }
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
