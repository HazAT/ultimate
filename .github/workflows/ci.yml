name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # The lockfile is authoritative: a dependency change that misses it fails here, not on a user's machine.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # `vite.config.ts` runs 8 workers, which suits a development machine. The server-heavy suites start real
      # servers and streams, so oversubscribing a 2-core runner pushes their slowest cases past the 30 s limit;
      # two workers keeps them inside it.
      - run: pnpm test -- --maxWorkers=2

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    env:
      # The runner cannot start Chromium's sandbox; the browser extension turns it
      # back off when this is set to 0 (extensions/browser/server.ts).
      ULTIMATE_CHROMIUM_SANDBOX: '0'
    # Separate job: it needs a browser download the fast suites do not, so a slow e2e run cannot hide a failing check.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Some e2e suites make commits and only set a local identity in some of them; a runner has no global one.
      - run: |
          git config --global user.name 'CI'
          git config --global user.email 'ci@example.test'
      # The dependency is `playwright-core`, whose CLI is `playwright-core`; it ships no browser of its own, and the
      # browser e2e finds one under ~/.cache/ms-playwright. `--with-deps` pulls the system libraries Chromium needs.
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test:e2e
