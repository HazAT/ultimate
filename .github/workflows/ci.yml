name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # The lockfile is authoritative: a dependency change that misses it fails here, not on a user's machine.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # Separate job: it needs a browser download the fast suites do not, so a slow e2e run cannot hide a failing check.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright-core ships no browser; the browser chat e2e finds one under ~/.cache/ms-playwright.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
